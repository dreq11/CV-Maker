<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Builder</title>
    <link rel="stylesheet" href="builder.css">
</head>
<body>
    <a href="index.html" class="back-link">← Back to CV Templates</a>
  
    <div class="builder">

        <div class="form-panel">
            <h2>Your details</h2>

            <label for="layout-select">layout</label>
            <select id="layout-select">
                <option value="european">European Standard</option>
                <option value="gulf">Gulf Corporate Layout</option>
                <option value="dev">Tech/Dev Minimalist</option>
            </select>

            <label for="in-name">Full Name:</label>
            <input type="text" id="in-name" placeholder="Andrew Smith" required>
            
            <label for="in-title">Job Title:</label>
            <input type="text" id="in-title" placeholder="Software Engineer" required>

            <label for="in-contact-info">Email:</label>
            <input type="text" id="in-contact-info" placeholder="you@email.com" required>

            <label for="in-summary">Summary:</label>
            <textarea id="in-summary" rows="4" placeholder=" write 2-3 lines about yourself." required></textarea>
        </div>

        <div class="preview-panel" id="preview">
            <iframe id="cv-frame" src="cv-dev.html" title="CV preview"></iframe>
        </div>
    </div>
    <script src="builder.js"></script>
</body>
</html>
